<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediaVault</title>
<style>
  :root { --bg:#101218; --panel:#181b24; --panel2:#20242f; --text:#e8eaf0; --dim:#8b92a6; --accent:#5aa9ff; --line:#262b38; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; }

  /* ---- top bar ---- */
  .top { display: flex; align-items: center; gap: 18px; padding: 12px 22px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .3px; }
  .brand span { color: var(--accent); }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 7px 16px; border-radius: 999px; color: var(--dim); }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--panel2); color: var(--text); }
  .grow { flex: 1; }
  #search { width: 220px; max-width: 28vw; background: var(--panel); border: 1px solid var(--line); color: var(--text);
            border-radius: 999px; padding: 7px 14px; outline: none; user-select: text; }
  #search:focus { border-color: var(--accent); }
  .menu { position: relative; }
  #menuBtn { font-size: 22px; line-height: 1; padding: 4px 10px; border-radius: 8px; color: var(--dim); }
  #menuBtn:hover { background: var(--panel2); color: var(--text); }
  #menuPop { position: absolute; right: 0; top: 38px; z-index: 30; min-width: 220px; background: var(--panel2);
             border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 10px 30px #0008; }
  #menuPop[hidden] { display: none; }
  #menuPop button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 7px; }
  #menuPop button:hover { background: #2b3040; }

  /* ---- content ---- */
  main { flex: 1; overflow: auto; padding: 24px 28px; }
  h2 { font-size: 24px; margin-bottom: 2px; }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .back { color: var(--accent); margin-bottom: 14px; display: inline-block; }
  .back:hover { text-decoration: underline; }
  .empty { max-width: 460px; margin: 12vh auto 0; text-align: center; color: var(--dim); }
  .empty h2 { color: var(--text); margin-bottom: 8px; }
  .empty button { margin-top: 18px; background: var(--accent); color: #07121f; font-weight: 600; padding: 10px 20px; border-radius: 999px; }
  .none { color: var(--dim); padding: 40px 0; text-align: center; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 22px 18px; }
  .card { cursor: pointer; min-width: 0; }
  .art { aspect-ratio: 1; border-radius: 10px; background: #262a36 center/cover no-repeat; display: grid; place-items: center;
         font-size: 44px; font-weight: 700; color: #ffffff55; margin-bottom: 8px; overflow: hidden; }
  .art.poster { aspect-ratio: 2/3; }
  .card:hover .art { outline: 2px solid var(--accent); }
  .card .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .head { display: flex; gap: 22px; align-items: flex-end; margin-bottom: 18px; }
  .head .art { width: 150px; margin: 0; flex: none; }
  .row { display: flex; gap: 14px; padding: 9px 12px; border-radius: 8px; cursor: pointer; align-items: baseline; }
  .row:hover { background: var(--panel2); }
  .row .n { width: 54px; color: var(--dim); text-align: right; flex: none; }
  .row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.playing { color: var(--accent); }
  .season { margin: 22px 0 6px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }

  /* ---- now playing overlay (music) ---- */
  #now { position: fixed; inset: 0 0 76px 0; z-index: 20; background: var(--bg); display: none; align-items: center;
         justify-content: center; gap: 36px; flex-wrap: wrap; padding: 24px; }
  #now.open { display: flex; }
  #now .cover { width: min(380px, 60vw); aspect-ratio: 1; border-radius: 14px; background: #262a36 center/cover no-repeat;
                display: grid; place-items: center; font-size: 90px; color: #ffffff33; }
  #now .meta { max-width: 380px; }
  #now .title { font-size: 30px; font-weight: 700; }
  #now .line { color: var(--dim); font-size: 17px; }
  #now .line.link:hover { color: var(--accent); cursor: pointer; }
  #now .close { position: absolute; top: 14px; right: 22px; font-size: 26px; color: var(--dim); }

  /* ---- player bar ---- */
  footer { display: flex; align-items: center; gap: 18px; padding: 12px 22px; border-top: 1px solid var(--line); background: var(--panel); height: 76px; z-index: 25; }
  .nowinfo { display: flex; align-items: center; gap: 12px; width: 280px; min-width: 0; cursor: pointer; }
  .thumb { width: 50px; height: 50px; border-radius: 8px; background: #262a36 center/cover no-repeat; display: grid; place-items: center;
           color: #ffffff44; font-weight: 700; flex: none; }
  .nowtext { min-width: 0; }
  .nowtext .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nowtext .s { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl { display: flex; align-items: center; }
  .ctl button { font-size: 20px; padding: 4px 10px; border-radius: 8px; }
  .ctl button:hover { background: var(--panel2); }
  .ctl .play { font-size: 26px; }
  .bar { flex: 1; display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 13px; min-width: 0; }
  .bar input { flex: 1; min-width: 0; }
  input[type=range] { accent-color: var(--accent); }
  #vol { width: 90px; }
  #toVideo { background: var(--accent); color: #07121f; font-weight: 600; padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
  #toVideo[hidden] { display: none; }
  /* ---- list / grid toggle ---- */
  .tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; min-height: 30px; }
  .tools .sub { margin: 0; }
  .vt { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .vt button { padding: 5px 12px; color: var(--dim); font-size: 16px; line-height: 1; }
  .vt button:hover { color: var(--text); }
  .vt button.on { background: var(--panel2); color: var(--text); }
  .lrow { display: flex; align-items: center; gap: 14px; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  .lrow:hover { background: var(--panel2); }
  .lrow .lthumb { width: 46px; height: 46px; border-radius: 6px; background: #262a36 center/cover no-repeat; display: grid;
                  place-items: center; font-weight: 700; color: #ffffff55; flex: none; overflow: hidden; }
  .lrow .lthumb.poster { height: 62px; }
  .lrow .lname { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .lmeta { color: var(--dim); font-size: 13px; flex: none; }
  .art.season { aspect-ratio: 3/2; font-size: 30px; }

  /* ---- video screen: the app draws the video over #videoSlot ---- */
  #videoSlot { flex: 1; background: #000; display: none; min-height: 0; }
  body.video main { display: none; }
  body.video #videoSlot { display: block; }
  #backLib { display: none; color: var(--accent); padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
  #backLib:hover { background: var(--panel2); }
  body.video #backLib { display: inline-block; }
  #statusbar { height: 24px; flex: none; padding: 3px 22px; font-size: 12px; color: var(--dim); background: var(--panel);
               border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #statusbar.msg { color: var(--text); }
  body.video.fs.hidebars .top, body.video.fs.hidebars footer, body.video.fs.hidebars #statusbar { display: none; }
  body.video.fs.hidebars { cursor: none; }
  @media (max-width: 760px) { .nowinfo { width: 150px; } #vol { display: none; } .tabs .tab { padding: 7px 10px; } }
</style>
</head>
<body>
<div class="top">
  <div class="brand">Media<span>Vault</span></div>
  <button id="backLib" title="Back to the library">◀ Library</button>
  <nav class="tabs">
    <button class="tab" data-tab="music">Music</button>
    <button class="tab" data-tab="movies">Movies</button>
    <button class="tab" data-tab="tv">TV Shows</button>
  </nav>
  <div class="grow"></div>
  <input id="search" type="search" placeholder="Search" autocomplete="off">
  <div class="menu">
    <button id="menuBtn" title="Menu">⋯</button>
    <div id="menuPop" hidden>
      <button id="mOpen">Open media folder…</button>
      <button id="mRescan">Rescan library</button>
      <button id="mFull">Fullscreen</button>
    </div>
  </div>
</div>

<main id="main"></main>
<div id="videoSlot"></div>

<div id="now">
  <button class="close" id="nowClose" title="Close">✕</button>
  <div class="cover" id="nowCover"></div>
  <div class="meta">
    <div class="title" id="nowTitle"></div>
    <div class="line link" id="nowArtist"></div>
    <div class="line link" id="nowAlbum"></div>
  </div>
</div>

<footer>
  <div class="nowinfo" id="nowInfo">
    <div class="thumb" id="thumb">♪</div>
    <div class="nowtext"><div class="t" id="barTitle">Nothing playing</div><div class="s" id="barSub"></div></div>
  </div>
  <div class="ctl">
    <button id="prev" title="Previous">⏮</button>
    <button id="play" class="play" title="Play / pause">▶</button>
    <button id="next" title="Next">⏭</button>
  </div>
  <div class="bar"><span id="pos">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <button id="toVideo" hidden>Return to video</button>
  <input id="vol" type="range" min="0" max="100" value="80" title="Volume">
</footer>
<div id="statusbar">Ready</div>

<script>
(function () {
  'use strict';
  var MV = window.MediaVault;
  var $ = function (id) { return document.getElementById(id); };
  var main = $('main');

  if (!MV) { main.innerHTML = '<div class="empty"><h2>Open this theme in MediaVault</h2></div>'; return; }

  var lib = { root: '', movies: [], shows: [], artists: [] };
  var state = null;
  var q = '';
  var seeking = false;
  var nav = { tab: 'music', artist: null, album: null, show: null, season: null };
  var views = { music: 'grid', tv: 'grid' };   // grid or list, remembered per tab
  try {
    ['music', 'tv'].forEach(function (k) {
      var v = localStorage.getItem('mv.classic.view.' + k);
      if (v === 'grid' || v === 'list') views[k] = v;
    });
  } catch (e) {}
  try { var saved = localStorage.getItem('mv.classic.tab'); if (saved) nav.tab = saved; } catch (e) {}

  // ---------- helpers ----------
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmt(ms) {
    var s = Math.floor((ms || 0) / 1000), m = Math.floor(s / 60);
    return m + ':' + String(s % 60).padStart(2, '0');
  }
  function bg(node, url) { if (url) node.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")'; }
  function hue(name) { var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360; return h; }
  function tint(node, name) {
    var h = hue(name);
    node.style.background = 'linear-gradient(135deg, hsl(' + h + ' 40% 30%), hsl(' + ((h + 40) % 360) + ' 45% 16%))';
  }
  function match(text) { return !q || text.toLowerCase().indexOf(q) !== -1; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function epLabel(e) { return e.episode > 0 ? 'E' + String(e.episode).padStart(2, '0') : ''; }
  function hasLibrary() { return lib.artists.length || lib.movies.length || lib.shows.length; }

  function card(name, meta, art, poster, onClick, imageUrl) {
    var c = el('div', 'card');
    var a = el('div', 'art' + (poster ? ' poster' : ''), imageUrl ? '' : name.charAt(0).toUpperCase());
    if (imageUrl) bg(a, imageUrl); else tint(a, name);
    c.appendChild(a);
    c.appendChild(el('div', 'name', name));
    if (meta) c.appendChild(el('div', 'meta', meta));
    c.onclick = onClick;
    return c;
  }
  function lrow(name, meta, imageUrl, poster, onClick) {
    var r = el('div', 'lrow');
    var t = el('div', 'lthumb' + (poster ? ' poster' : ''), imageUrl ? '' : name.charAt(0).toUpperCase());
    if (imageUrl) bg(t, imageUrl); else tint(t, name);
    r.appendChild(t);
    r.appendChild(el('div', 'lname', name));
    if (meta) r.appendChild(el('div', 'lmeta', meta));
    r.onclick = onClick;
    return r;
  }
  // Header row for a view that can switch between grid and list.
  function tools(key, subText) {
    var row = el('div', 'tools');
    row.appendChild(el('div', 'sub', subText || ''));
    var vt = el('div', 'vt');
    [['grid', '▦', 'Grid view'], ['list', '☰', 'List view']].forEach(function (m) {
      var b = el('button', views[key] === m[0] ? 'on' : '', m[1]);
      b.title = m[2];
      b.onclick = function () {
        if (views[key] === m[0]) return;
        views[key] = m[0];
        try { localStorage.setItem('mv.classic.view.' + key, m[0]); } catch (e) {}
        render();
      };
      vt.appendChild(b);
    });
    row.appendChild(vt);
    return row;
  }
  function backLink(text, fn) { var b = el('button', 'back', '‹ ' + text); b.onclick = fn; return b; }
  function artistImage(a) {
    if (a.image) return a.image;
    for (var i = 0; i < a.albums.length; i++) if (a.albums[i].cover) return a.albums[i].cover;
    return '';
  }

  // ---------- views ----------
  function viewEmpty() {
    var box = el('div', 'empty');
    if (!lib.root) {
      box.appendChild(el('h2', null, 'Choose your media folder'));
      box.appendChild(el('div', null, 'Pick the folder that contains your Music, Movies and TV Shows folders.'));
    } else {
      box.appendChild(el('h2', null, 'Nothing found'));
      box.appendChild(el('div', null, 'No media was found in ' + lib.root + '. It should contain Music, Movies and TV Shows folders.'));
    }
    var b = el('button', null, lib.root ? 'Choose another folder' : 'Choose folder…');
    b.onclick = function () { MV.openFolder(); };
    box.appendChild(b);
    main.appendChild(box);
  }

  function viewMusic() {
    if (nav.album) return viewAlbum();
    if (nav.artist) return viewArtist();
    var list = lib.artists.filter(function (a) { return match(a.name); });
    if (!list.length) { main.appendChild(el('div', 'none', lib.artists.length ? 'No matches.' : 'No music found.')); return; }
    main.appendChild(tools('music', plural(list.length, 'artist', 'artists')));
    var grid = el('div', views.music === 'list' ? 'list' : 'grid');
    list.forEach(function (a) {
      var meta = plural(a.albums.length, 'album', 'albums');
      var open = function () { go({ artist: a.name }); };
      grid.appendChild(views.music === 'list' ? lrow(a.name, meta, artistImage(a), false, open)
                                              : card(a.name, meta, null, false, open, artistImage(a)));
    });
    main.appendChild(grid);
  }

  function viewArtist() {
    var a = lib.artists.find(function (x) { return x.name === nav.artist; });
    main.appendChild(backLink('Artists', function () { go({}); }));
    if (!a) { main.appendChild(el('div', 'none', 'Artist not found.')); return; }
    main.appendChild(el('h2', null, a.name));
    main.appendChild(tools('music', plural(a.albums.length, 'album', 'albums')));
    var grid = el('div', views.music === 'list' ? 'list' : 'grid');
    a.albums.filter(function (al) { return match(al.name); }).forEach(function (al) {
      var meta = plural(al.tracks.length, 'track', 'tracks');
      var open = function () { go({ artist: a.name, album: al.name }); };
      grid.appendChild(views.music === 'list' ? lrow(al.name, meta, al.cover, false, open)
                                              : card(al.name, meta, null, false, open, al.cover));
    });
    main.appendChild(grid);
  }

  function viewAlbum() {
    var a = lib.artists.find(function (x) { return x.name === nav.artist; });
    var al = a && a.albums.find(function (x) { return x.name === nav.album; });
    main.appendChild(backLink(nav.artist, function () { go({ artist: nav.artist }); }));
    if (!al) { main.appendChild(el('div', 'none', 'Album not found.')); return; }
    var head = el('div', 'head');
    var art = el('div', 'art', al.cover ? '' : al.name.charAt(0).toUpperCase());
    if (al.cover) bg(art, al.cover); else tint(art, al.name);
    var t = el('div');
    t.appendChild(el('h2', null, al.name));
    t.appendChild(el('div', 'sub', a.name + ' · ' + plural(al.tracks.length, 'track', 'tracks')));
    head.appendChild(art); head.appendChild(t);
    main.appendChild(head);
    al.tracks.forEach(function (tr, i) {
      if (!match(tr.title)) return;
      var r = el('div', 'row'); r.dataset.path = tr.path;
      r.appendChild(el('span', 'n', String(i + 1)));
      r.appendChild(el('span', 't', tr.title));
      r.onclick = function () { MV.playMedia(tr.path); };
      main.appendChild(r);
    });
  }

  function viewMovies() {
    var list = lib.movies.filter(function (m) { return match(m.title); });
    if (!list.length) { main.appendChild(el('div', 'none', lib.movies.length ? 'No matches.' : 'No movies found.')); return; }
    main.appendChild(el('div', 'sub', plural(list.length, 'movie', 'movies')));
    var grid = el('div', 'grid');
    list.forEach(function (m) {
      var c = card(m.title, '', null, true, function () { MV.playMedia(m.path); }, '');
      grid.appendChild(c);
    });
    main.appendChild(grid);
  }

  function viewTv() {
    if (nav.show) return viewShow();
    var list = lib.shows.filter(function (s) { return match(s.name); });
    if (!list.length) { main.appendChild(el('div', 'none', lib.shows.length ? 'No matches.' : 'No TV shows found.')); return; }
    main.appendChild(tools('tv', plural(list.length, 'show', 'shows')));
    var grid = el('div', views.tv === 'list' ? 'list' : 'grid');
    list.forEach(function (s) {
      var eps = s.seasons.reduce(function (n, se) { return n + se.episodes.length; }, 0);
      var meta = plural(eps, 'episode', 'episodes');
      var open = function () { go({ show: s.name }); };
      grid.appendChild(views.tv === 'list' ? lrow(s.name, meta, '', true, open)
                                           : card(s.name, meta, null, true, open, ''));
    });
    main.appendChild(grid);
  }

  function episodeRows(se, eps) {
    eps.forEach(function (e) {
      var r = el('div', 'row'); r.dataset.path = e.path;
      r.appendChild(el('span', 'n', epLabel(e)));
      r.appendChild(el('span', 't', e.title));
      r.onclick = function () { MV.playMedia(e.path); };
      main.appendChild(r);
    });
  }
  function seasonName(se) { return se.number > 0 ? 'Season ' + se.number : 'Episodes'; }

  function viewShow() {
    var s = lib.shows.find(function (x) { return x.name === nav.show; });
    if (nav.season != null && s) return viewSeason(s);
    main.appendChild(backLink('TV Shows', function () { go({}); }));
    if (!s) { main.appendChild(el('div', 'none', 'Show not found.')); return; }
    main.appendChild(el('h2', null, s.name));
    main.appendChild(tools('tv', plural(s.seasons.length, 'season', 'seasons')));
    if (views.tv === 'grid') {
      // One card per season; a season opens to its episodes.
      var grid = el('div', 'grid');
      s.seasons.forEach(function (se) {
        if (q && !se.episodes.some(function (e) { return match(e.title) || match(epLabel(e)); })) return;
        var c = card(seasonName(se), plural(se.episodes.length, 'episode', 'episodes'), null, false,
          function () { go({ show: s.name, season: se.number }); }, '');
        c.querySelector('.art').classList.add('season');
        grid.appendChild(c);
      });
      main.appendChild(grid);
      return;
    }
    s.seasons.forEach(function (se) {
      var eps = se.episodes.filter(function (e) { return match(e.title) || match(epLabel(e)); });
      if (!eps.length) return;
      main.appendChild(el('div', 'season', seasonName(se)));
      episodeRows(se, eps);
    });
  }

  function viewSeason(s) {
    var se = s.seasons.find(function (x) { return x.number === nav.season; });
    main.appendChild(backLink(s.name, function () { go({ show: s.name }); }));
    if (!se) { main.appendChild(el('div', 'none', 'Season not found.')); return; }
    main.appendChild(el('h2', null, s.name));
    main.appendChild(el('div', 'sub', seasonName(se) + ' · ' + plural(se.episodes.length, 'episode', 'episodes')));
    episodeRows(se, se.episodes.filter(function (e) { return match(e.title) || match(epLabel(e)); }));
  }

  function markPlaying() {
    var cur = state && state.path;
    main.querySelectorAll('.row').forEach(function (r) { r.classList.toggle('playing', !!cur && r.dataset.path === cur); });
  }

  function render() {
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.dataset.tab === nav.tab); });
    var keep = main.scrollTop;
    main.textContent = '';
    if (!hasLibrary()) viewEmpty();
    else if (nav.tab === 'music') viewMusic();
    else if (nav.tab === 'movies') viewMovies();
    else viewTv();
    markPlaying();
    main.scrollTop = keep;
  }

  function go(p) {
    nav.artist = p.artist || null; nav.album = p.album || null; nav.show = p.show || null; nav.season = p.season == null ? null : p.season;
    q = ''; $('search').value = '';
    main.scrollTop = 0;
    render();
  }

  // ---------- player bar + now playing ----------
  function subtitle(s) {
    if (s.kind === 'music') return s.artist + ' — ' + s.album;
    if (s.kind === 'video') {
      if (s.show) return s.show + ' · S' + s.season + 'E' + String(s.episode).padStart(2, '0');
      return 'Movie';
    }
    return '';
  }

  function renderBar() {
    var s = state; if (!s) return;
    var any = s.kind !== 'none';
    $('barTitle').textContent = any ? s.title : 'Nothing playing';
    $('barSub').textContent = any ? subtitle(s) : '';
    var th = $('thumb');
    th.style.backgroundImage = ''; th.style.background = '';
    if (s.kind === 'music' && s.cover) { th.textContent = ''; bg(th, s.cover); }
    else { th.textContent = s.kind === 'video' ? '▶' : '♪'; }
    $('play').textContent = s.playing ? '⏸' : '▶';
    $('pos').textContent = fmt(s.position);
    $('dur').textContent = fmt(s.duration);
    if (!seeking) $('seek').value = s.duration ? Math.round(1000 * s.position / s.duration) : 0;
    var v = $('vol'); if (document.activeElement !== v) v.value = s.volume;
    $('toVideo').hidden = !(s.kind === 'video' && s.page !== 'video');

    if ($('now').classList.contains('open')) {
      if (s.kind !== 'music') { closeNow(); return; }
      $('nowTitle').textContent = s.title;
      $('nowArtist').textContent = s.artist;
      $('nowAlbum').textContent = s.album;
      var c = $('nowCover'); c.style.backgroundImage = '';
      c.textContent = s.cover ? '' : '♪'; bg(c, s.cover);
    }
  }
  function openNow() {
    if (!state || state.kind !== 'music') return;
    $('now').classList.add('open'); renderBar();
  }
  function closeNow() { $('now').classList.remove('open'); }

  // ---------- wiring ----------
  document.querySelectorAll('.tab').forEach(function (t) {
    t.onclick = function () {
      nav.tab = t.dataset.tab;
      try { localStorage.setItem('mv.classic.tab', nav.tab); } catch (e) {}
      closeNow(); go({});
      if (state && state.page === 'video') MV.showLibrary();
    };
  });
  $('search').oninput = function (e) { q = e.target.value.trim().toLowerCase(); render(); };

  var pop = $('menuPop');
  $('menuBtn').onclick = function (e) { e.stopPropagation(); pop.hidden = !pop.hidden; };
  document.addEventListener('click', function () { pop.hidden = true; });
  $('mOpen').onclick = function () { MV.openFolder(); };
  $('mRescan').onclick = function () { MV.rescan(); };
  $('mFull').onclick = function () { MV.toggleFullscreen(); };

  $('play').onclick = function () { MV.togglePlay(); };
  $('prev').onclick = function () { MV.previous(); };
  $('next').onclick = function () { MV.next(); };
  $('backLib').onclick = function () { MV.showLibrary(); };
  $('toVideo').onclick = function () { MV.showVideo(); };
  $('nowInfo').onclick = function () { if (state && state.kind === 'video') MV.showVideo(); else openNow(); };
  $('nowClose').onclick = closeNow;
  $('nowArtist').onclick = function () { var a = state && state.artist; if (a) { closeNow(); nav.tab = 'music'; go({ artist: a }); } };
  $('nowAlbum').onclick = function () { if (state) { closeNow(); nav.tab = 'music'; go({ artist: state.artist, album: state.album }); } };
  var seek = $('seek');
  seek.oninput = function () { seeking = true; };
  seek.onchange = function () { seeking = false; if (state && state.duration) MV.seek(seek.value / 1000 * state.duration); };
  $('vol').oninput = function (e) { MV.setVolume(+e.target.value); };

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeNow(); pop.hidden = true; }
    else if (e.key === '/' && document.activeElement !== $('search')) { e.preventDefault(); $('search').focus(); }
  });

  // ---------- video screen ----------
  // The app draws the video over #videoSlot, so the top bar, player bar and
  // status bar around it stay part of the page.
  var onVideo = false, hideTimer = 0, overBars = false;
  function setBarsHidden(h) { document.body.classList.toggle('hidebars', h); }
  function armHide() {
    clearTimeout(hideTimer);
    if (!document.body.classList.contains('fs')) return;
    hideTimer = setTimeout(function () {
      if (overBars) armHide(); else setBarsHidden(true);
    }, 3000);
  }
  function wake() { setBarsHidden(false); armHide(); }
  function syncVideo(s) {
    var v = s.page === 'video';
    document.body.classList.toggle('video', v);
    document.body.classList.toggle('fs', !!s.fullscreen && v);
    if (v && !onVideo && MV.bindVideo) MV.bindVideo($('videoSlot'));
    if (!v && onVideo && MV.unbindVideo) MV.unbindVideo();
    onVideo = v;
    if (v && s.fullscreen) { if (!hideTimer) wake(); }
    else { clearTimeout(hideTimer); hideTimer = 0; setBarsHidden(false); }
  }
  ['mousemove', 'mousedown', 'keydown'].forEach(function (n) {
    window.addEventListener(n, function () { if (onVideo) wake(); });
  });
  [document.querySelector('.top'), document.querySelector('footer')].forEach(function (b) {
    b.addEventListener('mouseenter', function () { overBars = true; });
    b.addEventListener('mouseleave', function () { overBars = false; });
  });
  MV.on('activity', function () { if (onVideo) wake(); });

  var statusTimer = 0;
  MV.on('status', function (text) {
    var sb = $('statusbar');
    sb.textContent = text; sb.classList.add('msg');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { sb.textContent = lib.root || 'Ready'; sb.classList.remove('msg'); }, 6000);
  });

  function loadLibrary() { MV.getLibrary().then(function (l) { lib = l; render(); }); }
  MV.on('library', loadLibrary);
  MV.on('ready', loadLibrary);
  MV.on('state', function (s) {
    var newRoot = state ? state.root !== s.root : false;
    var newPath = !state || state.path !== s.path;
    state = s;
    syncVideo(s);
    renderBar();
    if (newRoot) loadLibrary();
    if (newPath) markPlaying();
  });
})();
</script>
</body>
</html>
